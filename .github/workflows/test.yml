name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Fiyatlandirma, para, durak, paket, hali numarasi, tahsilat ve konum.
      # Hicbiri sorgu atmaz. test-halino src/lib/haliNo -> prisma zincirini
      # cektigi icin prisma.ts yuklenirken bir DATABASE_URL gormek zorunda;
      # asagidaki sahte deger yalnizca o yuklemeyi gecmek icin, baglanti kurulmaz.
      - run: npm test
        env:
          DATABASE_URL: postgresql://x:x@localhost:5432/x
