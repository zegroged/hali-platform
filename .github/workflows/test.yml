name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Fiyatlandirma, para, durak tespiti, paket ve tahsilat testleri.
      # Hepsi hermetik: veritabani, iyzico anahtari ya da ag erisimi istemez.
      - run: npm test
