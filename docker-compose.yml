# YALNIZCA GELİŞTİRME / yerel tam-container testi içindir.
# ÜRETİMDE aktif dosya docker-compose.prod.yml'den kopyalanır (DEVIR §3).
# 2026-07-23 KAZA DERSİ: bu dosya deploy tar'ıyla sunucudaki üretim compose'unu
# ezdi → db yeniden yaratıldı → şifre uyuşmazlığı → site 502. İKİ katmanlı önlem:
# (1) §3 tar'ı artık docker-compose*.yml'i HARİÇ tutar; (2) bu dosya yine de
# ezilirse zarar vermesin diye şifre .env'den okunur (yoksa dev varsayılanı).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hali
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hali} # .env'den; yoksa yalnız-dev varsayılanı
      POSTGRES_DB: hali
    ports:
      # Sadece localhost'a bağla — DB'yi internete/LAN'a açma.
      - "127.0.0.1:5433:5432"
    volumes:
      - hali_pgdata:/var/lib/postgresql/data

  # Tam container testi: docker compose up --build
  # Sırlar host ortamından / .env'den alınır; insecure inline default YOK.
  # Üretimde gerçek değerlerle bir .env (veya secret injection) sağla; aksi halde
  # uygulama validateConfig() ile başlangıçta durur (mock ödeme/SMS ile çıkmayı engeller).
  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      # Container içi DB adresi host .env'deki localhost:5433'ü ezer.
      DATABASE_URL: "postgresql://hali:${POSTGRES_PASSWORD:-hali}@db:5432/hali?schema=public"
    ports:
      - "3000:3000"

volumes:
  hali_pgdata:
