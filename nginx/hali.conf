# EN YAKIN HALI YIKAMA — izole. Kaldirmak: container'da rm /etc/nginx/conf.d/hali.conf + reload.
server {
    listen 80;
    listen [::]:80;
    server_name enyakinhaliyikamaservisi.com www.enyakinhaliyikamaservisi.com;
    client_max_body_size 12m;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/uploads/acme/.well-known/acme-challenge/;
        default_type "text/plain";
        try_files $uri =404;
    }
    location / {
        set $hali http://hali-app-1:3000;
        proxy_pass $hali;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name enyakinhaliyikamaservisi.com www.enyakinhaliyikamaservisi.com;
    client_max_body_size 12m;
    server_tokens off;
    ssl_certificate     /etc/nginx/certs/hali-selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/hali-selfsigned.key;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $hali http://hali-app-1:3000;
        proxy_pass $hali;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
